server:
  address: 0.0.0.0
  port: 8024
  servlet:
    session:
      timeout: 604800  # 会话超时7天（单位：秒）
      cookie:
        name: JSESSIONID
        max-age: 2592000  # Cookie有效期30天
        http-only: true   # 推荐开启
        secure: true      # 生产环境必须true (HTTPS)
        same-site: lax    # 或 none (跨站场景)
        path: /
#        domain: yourdomain.com # 明确指定域名



# ??????
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.myAI.myAI.controller
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）

