spring:
  application:
    name: myAI
  profiles:
    active: test # 默认使用本地开发环境
  # DevTools 热重载配置（仅开发环境生效）
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**
    livereload:
      enabled: true
      port: 35729
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://47.119.128.91:3306/my_ai_test
    username: root
    password: 5mn2FBt3zZFWCZSH
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
# 通用服务器配置
server:
  port: 8024
  servlet:
    session:
      cookie:
        http-only: true
        max-age: 2592000
        name: JSESSIONID
        same-site: lax
        path: /

# API 文档配置
knife4j:
  enable: true
  openapi:
    title: "MyAI 接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.myAI.myAI.controller
# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
